name: Market Wavez Morning Pre-Market

on:
  workflow_dispatch:
    inputs:
      section:
        description: "Brief panel to send"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - indian_markets
          - movers
          - global_markets
          - us_movers
          - crypto
          - ipos
          - flows
      brief:
        description: "Scheduled briefing window"
        required: false
        default: "morning"
        type: choice
        options:
          - morning
          - afternoon
          - night
          - full

  schedule:
    # 08:00 AM IST (UTC+5:30)
    - cron: "30 2 * * 1-5"

jobs:
  morning_premarket:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Sentinel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          python sentinel.py telegram --brief "${{ inputs.brief || 'morning' }}" --section "${{ inputs.section || 'full' }}"
